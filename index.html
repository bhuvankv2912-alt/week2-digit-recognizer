<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MNIST Digit Recognizer</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; background-color: #f4f4f9; }
    canvas { border: 3px solid #333; background-color: #ffffff; cursor: crosshair; border-radius: 8px; }
    .controls { margin-top: 15px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; background: #007bff; color: white; }
    button:hover { background: #0056b3; }
    #result { margin-top: 20px; font-size: 24px; font-weight: bold; color: #222; }
  </style>
</head>
<body>

  <h1>Digit Recognizer</h1>
  <p>Draw a single digit (0–9) on the canvas:</p>

  <canvas id="canvas" width="280" height="280"></canvas>

  <div class="controls">
    <button onclick="clearCanvas()">Clear Canvas</button>
  </div>

  <div id="result">Prediction: --</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 18;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); draw(e); });
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', () => { isDrawing = false; sendForPrediction(); });
    canvas.addEventListener('mouseleave', () => { isDrawing = false; });

    function draw(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function clearCanvas() {
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      document.getElementById('result').innerText = 'Prediction: --';
    }

    async function sendForPrediction() {
      const imageData = canvas.toDataURL('image/png');
      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: imageData })
        });
        const data = await response.json();
        document.getElementById('result').innerText = 
          `Prediction: ${data.prediction} (${data.confidence}% confidence)`;
      } catch (err) {
        console.error('Error fetching prediction:', err);
      }
    }
  </script>

</body>
</html>
